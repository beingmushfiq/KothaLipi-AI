<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="kothalipiLogoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b24" />
      <stop offset="50%" stop-color="#082b35" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>

    <!-- Emerald-Teal Script & Waveform Ribbon Gradient -->
    <linearGradient id="kothalipiRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Warm Amber Resonance Gradient -->
    <linearGradient id="kothalipiAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="kothalipiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Container (48x48) featuring Iconic 'ক' Glyph -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="url(#kothalipiLogoBgGrad)" />
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.2" />

    <!-- 1. Top Matra of 'ক' (মাত্রা) -->
    <line x1="9" y1="12" x2="39" y2="12" stroke="url(#kothalipiRibbonGrad)" stroke-width="2.6" stroke-linecap="round" />

    <!-- 2. Left Triangular Body & Apex of 'ক' -->
    <path
      d="M28 12 L13 24 L21 36 L28 23"
      stroke="url(#kothalipiRibbonGrad)"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Vertical Anchor Stem of 'ক' -->
    <line x1="28" y1="12" x2="28" y2="37" stroke="url(#kothalipiRibbonGrad)" stroke-width="2.6" stroke-linecap="round" />

    <!-- 4. Right Looping Wing of 'ক' -->
    <path
      d="M28 23 C35 21 38 27 34 32 C30.5 35.5 25.5 33 23 30"
      stroke="url(#kothalipiRibbonGrad)"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 5. Acoustic Voice Core at the Heart of 'ক' -->
    <circle cx="21" cy="24" r="2.4" fill="url(#kothalipiAccentGrad)" filter="url(#kothalipiGlow)" />

    <!-- 6. Acoustic Sound Waves (Kotha / Speech Waves) -->
    <path d="M36 20 C39 22 39 27 36 29" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
    <path d="M40 17 C44 21 44 29 40 33" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.03em" class="dark:fill-white">
    Kotha<tspan fill="#0d9488">Lipi</tspan>
  </text>
  <text x="68" y="47" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-weight="600" font-size="12" fill="#0d9488" letter-spacing="0.01em">
    কথালিপি · কণ্ঠস্বর, লিপি ও লেখনী এআই
  </text>
</svg>
