<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="kothaKaBg" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#0f1f33" />
      <stop offset="55%" stop-color="#081322" />
      <stop offset="100%" stop-color="#030810" />
    </radialGradient>

    <!-- Kinetic Teal to Cyan Soundwave Gradient -->
    <linearGradient id="kothaKaWaveGrad" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="64" y2="0">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Saffron Core Gradient -->
    <linearGradient id="kothaKaAccentGrad" gradientUnits="userSpaceOnUse" x1="24" y1="28" x2="32" y2="36">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base Tile -->
  <rect width="64" height="64" rx="16" fill="url(#kothaKaBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(45, 212, 191, 0.28)" stroke-width="1.5" />

  <!-- Iconic 'ক' (Ka / Kotha) Calligraphic-Waveform Glyph -->
  <!-- 1. Top Matra (মাত্রা) -->
  <line x1="13" y1="16" x2="51" y2="16" stroke="url(#kothaKaWaveGrad)" stroke-width="3.4" stroke-linecap="round" />

  <!-- 2. Left Triangular Body & Apex of 'ক' -->
  <path
    d="M37 16 L18 32 L28 47 L37 31"
    stroke="url(#kothaKaWaveGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Vertical Anchor Stem of 'ক' -->
  <line x1="37" y1="16" x2="37" y2="48" stroke="url(#kothaKaWaveGrad)" stroke-width="3.4" stroke-linecap="round" />

  <!-- 4. Right Looping Wing of 'ক' -->
  <path
    d="M37 31 C46 28 50 36 45 42 C40.5 46.5 34 43 31 39"
    stroke="url(#kothaKaWaveGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Acoustic Core Orb at the Heart of 'ক' -->
  <circle cx="28" cy="32" r="5" fill="url(#kothaKaAccentGrad)" opacity="0.22" />
  <circle cx="28" cy="32" r="3.2" fill="url(#kothaKaAccentGrad)" />

  <!-- 6. Acoustic Sound Waves Radiating Outward -->
  <path
    d="M48 26 C52 29 52 35 48 38"
    stroke="#38bdf8"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M53 22 C59 27 59 39 53 44"
    stroke="#38bdf8"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.5"
  />
</svg>
