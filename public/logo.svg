<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b24" />
      <stop offset="50%" stop-color="#082b35" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>

    <!-- Emerald-Teal Script Ribbon Gradient -->
    <linearGradient id="logoRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Warm Golden Quill Gradient -->
    <linearGradient id="logoQuillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Container (48x48) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logoBgGrad)" />
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.2" />

    <!-- Acoustic Soundwaves -->
    <path d="M33 18 C36 21 36 27 33 30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M37 15 C41 20 41 28 37 33" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

    <!-- Bengali 'ল' (Lipi) Curve & Matra -->
    <path d="M10 13 H33" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <path
      d="M13 13 C13 20 16 26 20 26 C23 26 25 22 25 18 C25 23 28 34 32 36"
      stroke="url(#logoRibbonGrad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Golden Quill Nib -->
    <path
      d="M20 13 L23 21 L26 21 L28 13 Z"
      fill="url(#logoQuillGrad)"
      stroke="#fef08a"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <line x1="24.5" y1="15" x2="24.5" y2="20" stroke="#041b24" stroke-width="0.8" stroke-linecap="round" />

    <!-- Accents -->
    <circle cx="32" cy="36" r="2" fill="#f59e0b" filter="url(#logoGlow)" />
    <circle cx="10" cy="13" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="currentColor" letter-spacing="-0.03em">
    Lipi<tspan fill="#0d9488">Kotha</tspan>
  </text>
  <text x="68" y="47" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="0.01em">
    লিপিকথা · লিপি, লেখনী ও কণ্ঠস্বর স্টুডিও
  </text>
</svg>
